# Watch official OrcaSlicer's src/slic3r/Utils/bambu_networking.hpp.
#
# OrcaSlicer is our slicer host: it validates the plugin by series
# (first 8 chars of bambu_network_get_version()) against
# AVAILABLE_NETWORK_VERSIONS and loads the library through the
# bambu_network_* dlsym interface declared in that header. When the file
# changes we want to know the same day, not when users report the
# "Bambu Network plug-in not detected" loop:
#   * a new latest series in AVAILABLE_NETWORK_VERSIONS  -> adaptive install
#     reports it (reported_version override), but a real ABI change needs a
#     rebuild;
#   * a removed/renamed exported function or struct change -> the shipped
#     .so/.dll is not safe anymore.
#
# On change this workflow commits the new content + sha256 under .github/,
# opens an issue with the diff, and (only when tools/abi_snapshot/v<new>/
# exists) dispatches build.yml for that ABI so artifacts are ready.
# build.yml is workflow_dispatch-only, so the dispatch cannot loop back.

name: Watch upstream OrcaSlicer

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-watch
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://raw.githubusercontent.com/OrcaSlicer/OrcaSlicer/main/src/slic3r/Utils/bambu_networking.hpp

jobs:
  watch:
    name: watch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch upstream header
        run: |
          curl -fsSL "$UPSTREAM_URL" -o /tmp/upstream_bambu_networking.hpp
          sha256sum /tmp/upstream_bambu_networking.hpp | awk '{print $1}' > /tmp/upstream.sha256
          echo "upstream sha: $(cat /tmp/upstream.sha256)"
          echo "known  sha: $(cat .github/upstream_watch.sha256 2>/dev/null || echo none)"

      - name: Compare
        id: compare
        run: |
          if [ ! -f .github/upstream_watch.sha256 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s /tmp/upstream.sha256 .github/upstream_watch.sha256; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new snapshot
        if: steps.compare.outputs.changed == 'true'
        id: snapshot
        run: |
          cp /tmp/upstream_bambu_networking.hpp .github/upstream_watch.hpp
          cp /tmp/upstream.sha256 .github/upstream_watch.sha256
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/upstream_watch.hpp .github/upstream_watch.sha256
          git commit -m "watch: upstream OrcaSlicer bambu_networking.hpp changed"
          git push

          LATEST=$(grep -oE '[0-9]{2}\.[0-9]{2}\.[0-9]{2}' .github/upstream_watch.hpp | sort -V | tail -1)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          if [ -d "tools/abi_snapshot/v${LATEST}" ]; then
            echo "snapshot=yes" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=no" >> "$GITHUB_OUTPUT"
          fi

      # Best effort: keep working when the repository has issues disabled.
      - name: Open issue
        if: steps.compare.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Official OrcaSlicer changed \`src/slic3r/Utils/bambu_networking.hpp\`."
            echo
            echo "Newest series found in AVAILABLE_NETWORK_VERSIONS: \`${{ steps.snapshot.outputs.latest }}\`"
            echo "(ABI snapshot directory present: ${{ steps.snapshot.outputs.snapshot }})."
            echo
            echo "Check the diff below; a struct or exported-function change needs a"
            echo "same-day rebuild of the plugin libraries, a pure version-row change"
            echo "is already covered by the adaptive install (reported_version override)."
            echo
            echo '```diff'
            git diff HEAD~1 -- .github/upstream_watch.hpp | sed -n '1,120p'
            echo '```'
          } > /tmp/issue.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "upstream: OrcaSlicer bambu_networking.hpp changed (${{ steps.snapshot.outputs.latest }})" \
            --body-file /tmp/issue.md

      - name: Dispatch ABI build
        if: steps.compare.outputs.changed == 'true' && steps.snapshot.outputs.snapshot == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f abi="${{ steps.snapshot.outputs.latest }}" \
            -f target_os=all \
            -f arch=all
          echo "Dispatched build.yml for abi=${{ steps.snapshot.outputs.latest }}"
